<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0284c7" />
		<meta name="apple-mobile-web-app-title" content="MAPFLOFA" />
		<meta name="application-name" content="MAPFLOFA" />
		<meta name="text-scale" content="scale" />
		<script>
			/* MAPFLOFA is light-mode only — always paint the bright sky-blue
			   palette and never flash a dark theme. */
			document.documentElement.setAttribute('data-theme', 'light');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
