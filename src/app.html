<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			/* Anti-FOUC theme bootstrap. Reads the saved preference and the
			   OS color-scheme, then sets data-theme on <html> BEFORE first
			   paint so the page never flashes the wrong palette. */
			(function () {
				try {
					var saved = localStorage.getItem('smp1a-theme');
					var pref = saved === 'light' || saved === 'dark' || saved === 'auto' ? saved : 'auto';
					var resolved =
						pref === 'auto'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: pref;
					document.documentElement.setAttribute('data-theme', resolved);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
